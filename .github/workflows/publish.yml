name: Publish RPM repository

# Rebuilds the whole repository from the .rpm files attached to the kUML
# GitHub Releases and deploys it to GitHub Pages (https://rpm.kuml.dev).
# Triggered by the kUML release workflow (repository_dispatch) or by hand.
on:
  repository_dispatch:
    types: [kuml-release]
  workflow_dispatch:
    inputs:
      releases:
        description: "Number of most recent kUML releases to include"
        default: "5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Fedora container: the repository is built and signed with Fedora's own
    # createrepo_c/rpmsign and then installed with dnf, so a green run proves
    # that dnf accepts it. Only the deploy job needs the Ubuntu runner.
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASES: ${{ github.event.inputs.releases || '5' }}
    steps:
      - name: Install tools
        run: dnf install -y createrepo_c rpm-sign gnupg2 gh git tar gzip findutils

      - uses: actions/checkout@v4

      - name: Import signing key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          if [ -z "$RPM_GPG_PRIVATE_KEY" ]; then
            echo "::error::secret RPM_GPG_PRIVATE_KEY is not set"
            exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          touch ~/.gnupg/passphrase && chmod 600 ~/.gnupg/passphrase
          if [ -n "$RPM_GPG_PASSPHRASE" ]; then
            printf '%s' "$RPM_GPG_PASSPHRASE" > ~/.gnupg/passphrase
          fi
          gpgconf --kill gpg-agent || true
          printf '%s' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "KEY_FPR=$FPR" >> "$GITHUB_ENV"
          # rpmsign signs every package with this key; the extra arguments make
          # gpg non-interactive (passphrase from file, loopback pinentry).
          {
            echo "%_gpg_name $FPR"
            echo "%_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $HOME/.gnupg/passphrase"
          } > ~/.rpmmacros

      - name: Download packages from kUML releases
        run: |
          mkdir -p rpms
          for tag in $(gh release list --repo kuml-dev/kUML --limit "$RELEASES" --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName'); do
            gh release download "$tag" --repo kuml-dev/kUML --pattern '*.rpm' --dir rpms || echo "::warning::no .rpm in $tag"
          done
          # The first desktop RPM (kUML 0.56.0) carried the jpackage-mapped version 56.0.0,
          # which rpm sorts ABOVE every real 0.x version, so dnf would never offer a newer
          # desktop package. It is left out of the repository (the 0.56.0 release itself is untouched).
          rm -f rpms/kuml-desktop-5[0-6].0.0-*.rpm
          ls -l rpms
          test -n "$(ls rpms/*.rpm 2>/dev/null)" || { echo "::error::no .rpm files found"; exit 1; }

      - name: Sign packages and build repository
        run: |
          mkdir -p public
          cp rpms/*.rpm public/
          rpmsign --addsign public/*.rpm
          createrepo_c public
          gpg --batch --pinentry-mode loopback --passphrase-file "$HOME/.gnupg/passphrase" \
            --detach-sign --armor --local-user "$KEY_FPR" public/repodata/repomd.xml
          gpg --armor --export "$KEY_FPR" > public/kuml.asc
          cat > public/kuml.repo <<'REPO'
          [kuml]
          name=kUML
          baseurl=https://rpm.kuml.dev/
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://rpm.kuml.dev/kuml.asc
          REPO
          cp site/index.html public/
          echo "rpm.kuml.dev" > public/CNAME
          touch public/.nojekyll

      - name: Verify signatures
        run: |
          gpg --verify public/repodata/repomd.xml.asc public/repodata/repomd.xml
          rpm --import public/kuml.asc
          rpm --checksig public/*.rpm

      - name: Install with dnf from the built repository
        run: |
          cat > /etc/yum.repos.d/kuml-test.repo <<REPO
          [kuml-test]
          name=kUML (test)
          baseurl=file://$GITHUB_WORKSPACE/public
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=file://$GITHUB_WORKSPACE/public/kuml.asc
          REPO
          dnf -y --disablerepo='*' --enablerepo=kuml-test list --available
          dnf install -y --disablerepo='*' --enablerepo=kuml-test --setopt=install_weak_deps=False kuml
          /opt/kuml/bin/kuml --version

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
